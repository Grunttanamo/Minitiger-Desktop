name: Publish Minitiger STABLE update

on:
  workflow_dispatch:
    inputs:
      approved_test_run:
        description: "Run ID of the approved 'Build Minitiger TEST' run (from its URL)"
        required: true
      notes:
        description: "Stable update notes"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: minitiger-private-update
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      DEFAULT_UPDATE_REPOSITORY: Grunttanamo/Minitiger-Desktop-Updates

    steps:
      - name: Validate exact approved TEST candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.MINITIGER_UPDATE_PUBLISH_TOKEN }}
          APPROVED_RUN: ${{ inputs.approved_test_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:APPROVED_RUN -notmatch '^\d+$') { throw 'approved_test_run must be the numeric run ID.' }
          $run = gh api "repos/${{ github.repository }}/actions/runs/$($env:APPROVED_RUN)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Approved TEST run not found.' }
          if ($run.name -ne 'Build Minitiger TEST') { throw "Run $($env:APPROVED_RUN) is '$($run.name)', not a TEST build." }
          if ($run.conclusion -ne 'success') { throw "Approved TEST run did not succeed ($($run.conclusion))." }
          "APPROVED_SHA=$($run.head_sha)" >> $env:GITHUB_ENV
          Write-Host "Approved TEST run $($env:APPROVED_RUN) built Desktop source $($run.head_sha)."
      - name: Resolve latest tested candidate
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.MINITIGER_UPDATE_PUBLISH_TOKEN }}
          CONFIGURED_UPDATE_REPOSITORY: ${{ vars.MINITIGER_UPDATE_REPOSITORY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targetRepo = if ($env:CONFIGURED_UPDATE_REPOSITORY) { $env:CONFIGURED_UPDATE_REPOSITORY } else { $env:DEFAULT_UPDATE_REPOSITORY }

          function Next-Version([string]$version) {
              if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)$') { throw "Unsupported stable version: $version" }
              $major = [int]$Matches[1]; $minor = [int]$Matches[2]; $patch = [int]$Matches[3] + 1
              if ($patch -ge 10) { $patch = 0; $minor += 1 }
              if ($minor -ge 10) { $minor = 0; $major += 1 }
              return "$major.$minor.$patch"
          }

          $all = @((& gh release list --repo $targetRepo --limit 1000 --json tagName,isPrerelease,publishedAt | ConvertFrom-Json))
          if ($LASTEXITCODE -ne 0) { throw 'Could not read private releases.' }

          $maxBuild = 0
          foreach ($release in $all) {
              if ([string]$release.tagName -match '-b(\d+)$') { $maxBuild = [Math]::Max($maxBuild, [int]$Matches[1]) }
          }

          $test = $all | Where-Object {
              $_.isPrerelease -eq $true -and [string]$_.tagName -match '^desktop-test-v\d+\.\d+\.\d+-b\d+$'
          } | Sort-Object { [DateTime]$_.publishedAt } -Descending | Select-Object -First 1

          if (-not $test) { throw 'No Minitiger TEST candidate exists to promote.' }

          $latest = (& gh api "repos/$targetRepo/releases/latest" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve latest stable release.' }
          if ([string]$latest.tag_name -notmatch '^desktop-v(\d+\.\d+\.\d+)-b\d+$') { throw "Unsupported latest stable tag: $($latest.tag_name)" }
          $expectedVersion = Next-Version $Matches[1]

          $tempDir = Join-Path $env:RUNNER_TEMP 'minitiger-promote-test'
          Remove-Item $tempDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tempDir | Out-Null
          & gh release download $test.tagName --repo $targetRepo --pattern 'minitiger-update.json' --dir $tempDir --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download manifest from $($test.tagName)." }

          $manifest = Get-Content (Join-Path $tempDir 'minitiger-update.json') -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          $sourceCommit = [string]$manifest.commit
          $webCommit = [string]$manifest.webCommit

          if ([string]$manifest.channel -ne 'test') { throw 'Selected release is not a TEST manifest.' }
          if ($version -ne $expectedVersion) { throw "Latest TEST is $version but next stable must be $expectedVersion." }
          if ($sourceCommit -notmatch '^[0-9a-f]{40}$') { throw 'TEST manifest has no valid Desktop source commit.' }
          if ($webCommit -notmatch '^[0-9a-f]{40}$') { throw 'TEST manifest has no valid Desktop-Web source commit.' }
          # Promote only the exact TEST build that was approved above.
          if ($sourceCommit -ne $env:APPROVED_SHA) { throw "Latest TEST $($test.tagName) was built from $sourceCommit, not from the approved run ($($env:APPROVED_SHA))." }

          $build = $maxBuild + 1
          "version=$version" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          "source_commit=$sourceCommit" >> $env:GITHUB_OUTPUT
          "web_commit=$webCommit" >> $env:GITHUB_OUTPUT
          "test_tag=$($test.tagName)" >> $env:GITHUB_OUTPUT
          Write-Host "Promoting $($test.tagName) -> $version · Build $build"

      - name: Checkout tested Minitiger Desktop source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.source_commit }}
          submodules: false

      - name: Initialize mpvqt from KDE GitHub mirror
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # KDE maintains a public read-only GitHub mirror. Keep the pinned
          # submodule commit: this is a URL fallback, not a version upgrade.
          git config --global 'url.https://github.com/KDE/mpvqt.git.insteadOf' 'https://invent.kde.org/libraries/mpvqt.git'
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Submodule sync failed.' }
          git -c http.version=HTTP/1.1 submodule update --init --recursive --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'mpvqt mirror checkout failed.' }

      - name: Set promoted STABLE build metadata
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BUILD: ${{ steps.release.outputs.build }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          WEB_COMMIT: ${{ steps.release.outputs.web_commit }}
          TEST_TAG: ${{ steps.release.outputs.test_tag }}
        run: |
          Set-Content -Path VERSION -Value $env:RELEASE_VERSION -NoNewline
          "MINITIGER_RELEASE_VERSION=$env:RELEASE_VERSION" >> $env:GITHUB_ENV
          "MINITIGER_PRIVATE_BUILD_NUMBER=$env:RELEASE_BUILD" >> $env:GITHUB_ENV
          "MINITIGER_RELEASE_CHANNEL=stable" >> $env:GITHUB_ENV
          "MINITIGER_SOURCE_COMMIT=$env:SOURCE_COMMIT" >> $env:GITHUB_ENV
          "MINITIGER_WEB_COMMIT_OVERRIDE=$env:WEB_COMMIT" >> $env:GITHUB_ENV
          "MINITIGER_WEB_RESOLVED_COMMIT=$env:WEB_COMMIT" >> $env:GITHUB_ENV
          "MINITIGER_PROMOTED_FROM=$env:TEST_TAG" >> $env:GITHUB_ENV
      - name: Install Node.js 24 for bundled Minitiger Web
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare Windows build dependencies
        shell: cmd
        run: |
          call dev\windows\setup.bat
          if errorlevel 1 exit /b 1

      - name: Prepare libVLC
        shell: cmd
        run: |
          call dev\windows\setup-vlc.bat
          if errorlevel 1 exit /b 1

      - name: Build clean private distribution
        shell: cmd
        run: |
          call dev\windows\package-clean.bat
          if errorlevel 1 exit /b 1

      - name: Create private update manifest
        shell: pwsh
        env:
          UPDATE_NOTES: ${{ inputs.notes }}
          MINITIGER_UPDATE_SIGNING_KEY: ${{ secrets.MINITIGER_UPDATE_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $version = (Get-Content VERSION -Raw).Trim()
          $build = [int]$env:MINITIGER_PRIVATE_BUILD_NUMBER
          $webCommitFile = Join-Path $env:GITHUB_WORKSPACE 'dev\windows\deps\minitiger-web-src\.minitiger-desktop-built-commit'

          if (-not (Test-Path $webCommitFile)) {
              throw 'Bundled Minitiger Web commit marker was not produced.'
          }

          $webCommit = (Get-Content $webCommitFile -Raw).Trim()
          if ($webCommit -notmatch '^[0-9a-f]{40}$') {
              throw "Invalid bundled Minitiger Web commit: $webCommit"
          }

          if ($env:MINITIGER_WEB_COMMIT_OVERRIDE -and $webCommit -ne $env:MINITIGER_WEB_COMMIT_OVERRIDE) {
              throw "Bundled Web commit $webCommit does not match tested commit $env:MINITIGER_WEB_COMMIT_OVERRIDE."
          }

          $installer = Get-ChildItem dist\Minitiger-Desktop-*-Installer.exe | Select-Object -First 1
          $portable = Get-ChildItem dist\Minitiger-Desktop-*-Portable.zip | Select-Object -First 1

          if (-not $installer -or -not $portable) {
              throw 'Private update packages were not produced.'
          }

          $installerHash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash -Algorithm SHA256 $portable.FullName).Hash.ToLowerInvariant()

          # Sign each package for the Desktop client (see kMinitigerUpdatePublicKey).
          if (-not $env:MINITIGER_UPDATE_SIGNING_KEY) { throw 'MINITIGER_UPDATE_SIGNING_KEY secret is missing; refusing to publish unsigned update packages.' }
          $signingKey = [System.Security.Cryptography.ECDsa]::Create()
          $signingKey.ImportFromPem($env:MINITIGER_UPDATE_SIGNING_KEY)
          if ($signingKey.KeySize -ne 256) { throw 'The update signing key must be an ECDSA P-256 key.' }
          function Get-MinitigerSignature([string]$packageType, [string]$sha256) {
              # Must match minitigerUpdateSignedMessage() in src/system/SystemComponent.cpp.
              $message = "minitiger-desktop-update/v1`n$packageType`n$version`n$build`n$sha256"
              $signature = $signingKey.SignData(
                  [System.Text.Encoding]::UTF8.GetBytes($message),
                  [System.Security.Cryptography.HashAlgorithmName]::SHA256,
                  [System.Security.Cryptography.DSASignatureFormat]::IeeeP1363FixedFieldConcatenation)
              return [Convert]::ToBase64String($signature)
          }
          # Self-check against the public key the client is built with.
          $publicKeyRaw = [Convert]::FromBase64String((Get-Content bundle\update-signing-public-key.txt -Raw).Trim())
          if ($publicKeyRaw.Length -ne 64) { throw 'bundle/update-signing-public-key.txt must hold the 64-byte P-256 point.' }
          $publicParameters = [System.Security.Cryptography.ECParameters]::new()
          $publicParameters.Curve = [System.Security.Cryptography.ECCurve+NamedCurves]::nistP256
          $point = [System.Security.Cryptography.ECPoint]::new()
          $point.X = [byte[]]$publicKeyRaw[0..31]
          $point.Y = [byte[]]$publicKeyRaw[32..63]
          $publicParameters.Q = $point
          $verifier = [System.Security.Cryptography.ECDsa]::Create($publicParameters)
          function Assert-MinitigerSignature([string]$packageType, [string]$sha256, [string]$signature) {
              $message = "minitiger-desktop-update/v1`n$packageType`n$version`n$build`n$sha256"
              $ok = $verifier.VerifyData(
                  [System.Text.Encoding]::UTF8.GetBytes($message),
                  [Convert]::FromBase64String($signature),
                  [System.Security.Cryptography.HashAlgorithmName]::SHA256,
                  [System.Security.Cryptography.DSASignatureFormat]::IeeeP1363FixedFieldConcatenation)
              if (-not $ok) { throw "Signature for the $packageType package does not match bundle/update-signing-public-key.txt." }
          }
          $installerSignature = Get-MinitigerSignature 'installer' $installerHash
          $portableSignature = Get-MinitigerSignature 'portable' $portableHash
          Assert-MinitigerSignature 'installer' $installerHash $installerSignature
          Assert-MinitigerSignature 'portable' $portableHash $portableSignature

          $manifest = [ordered]@{
              version = $version
              build = $build
              channel = 'stable'
              commit = [string]$env:MINITIGER_SOURCE_COMMIT
              webCommit = $webCommit
              promotedFrom = [string]$env:MINITIGER_PROMOTED_FROM
              publishedAt = (Get-Date).ToUniversalTime().ToString('o')
              notes = [string]$env:UPDATE_NOTES
              installer = [ordered]@{
                  fileName = $installer.Name
                  sha256 = $installerHash
                  size = [int64]$installer.Length
                  signature = $installerSignature
              }
              portable = [ordered]@{
                  fileName = $portable.Name
                  sha256 = $portableHash
                  size = [int64]$portable.Length
                  signature = $portableSignature
              }
          }

          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 dist\minitiger-update.json

          Write-Host "Private update manifest:"
          Get-Content dist\minitiger-update.json

      - name: Publish promoted STABLE update
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.MINITIGER_UPDATE_PUBLISH_TOKEN }}
          CONFIGURED_UPDATE_REPOSITORY: ${{ vars.MINITIGER_UPDATE_REPOSITORY }}
          UPDATE_NOTES: ${{ inputs.notes }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:GH_TOKEN) {
              throw 'Repository secret MINITIGER_UPDATE_PUBLISH_TOKEN is not configured.'
          }

          $targetRepo = if ($env:CONFIGURED_UPDATE_REPOSITORY) {
              $env:CONFIGURED_UPDATE_REPOSITORY
          } else {
              $env:DEFAULT_UPDATE_REPOSITORY
          }

          $version = (Get-Content VERSION -Raw).Trim()
          $build = [int]$env:MINITIGER_PRIVATE_BUILD_NUMBER
          $tag = "desktop-v$version-b$build"
          $title = "Minitiger Desktop $version · Build $build"

          $installer = (Get-ChildItem dist\Minitiger-Desktop-*-Installer.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem dist\Minitiger-Desktop-*-Portable.zip | Select-Object -First 1).FullName
          $manifest = (Resolve-Path dist\minitiger-update.json).Path

          $notes = if ($env:UPDATE_NOTES) {
              $env:UPDATE_NOTES
          } else {
              "Promoted from tested candidate $env:MINITIGER_PROMOTED_FROM."
          }

          Write-Host "Publishing promoted STABLE update to $targetRepo"
          Write-Host "Tag: $tag"

          & gh release create $tag --repo $targetRepo --title $title --notes $notes --latest $installer $portable $manifest

          if ($LASTEXITCODE -ne 0) {
              throw "Private GitHub release creation failed with exit code $LASTEXITCODE."
          }

      - name: Private update summary
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "### Minitiger tested candidate promoted to STABLE" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- Version: **$version**" >> $env:GITHUB_STEP_SUMMARY
          "- Build: **$env:MINITIGER_PRIVATE_BUILD_NUMBER**" >> $env:GITHUB_STEP_SUMMARY
          "- Desktop source: **$env:MINITIGER_SOURCE_COMMIT**" >> $env:GITHUB_STEP_SUMMARY
          "- Desktop-Web source: **$env:MINITIGER_WEB_RESOLVED_COMMIT**" >> $env:GITHUB_STEP_SUMMARY
          "- Promoted from: **$env:MINITIGER_PROMOTED_FROM**" >> $env:GITHUB_STEP_SUMMARY
          "- Normal auto-update channel: **Updated**" >> $env:GITHUB_STEP_SUMMARY
          "- Public Minitiger-Desktop release created: **No**" >> $env:GITHUB_STEP_SUMMARY
