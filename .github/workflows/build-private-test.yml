name: Build Minitiger TEST

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "TEST notes"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: minitiger-private-update
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      DEFAULT_UPDATE_REPOSITORY: Grunttanamo/Minitiger-Desktop-Updates

    steps:
      - name: Checkout Minitiger Desktop
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set Minitiger release version
        shell: pwsh
        run: |
          $ErrorAction      - name: Resolve next test candidate and build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.MINITIGER_UPDATE_PUBLISH_TOKEN }}
          CONFIGURED_UPDATE_REPOSITORY: ${{ vars.MINITIGER_UPDATE_REPOSITORY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:GH_TOKEN) {
              throw 'Repository secret MINITIGER_UPDATE_PUBLISH_TOKEN is not configured.'
          }

          $targetRepo = if ($env:CONFIGURED_UPDATE_REPOSITORY) {
              $env:CONFIGURED_UPDATE_REPOSITORY
          } else {
              $env:DEFAULT_UPDATE_REPOSITORY
          }

          function Get-NextMinitigerVersion([string]$version) {
              if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
                  throw "Unsupported stable version format: $version"
              }

              $major = [int]$Matches[1]
              $minor = [int]$Matches[2]
              $patch = [int]$Matches[3] + 1

              if ($patch -ge 10) {
                  $patch = 0
                  $minor += 1
              }

              if ($minor -ge 10) {
                  $minor = 0
                  $major += 1
              }

              return "$major.$minor.$patch"
          }

          $allJson = & gh api "repos/$targetRepo/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) {
              throw 'Could not read private update releases.'
          }

          $allReleases = @($allJson | ConvertFrom-Json)
          $maxBuild = 0

          foreach ($release in $allReleases) {
              if ([string]$release.tag_name -match '-b(\d+)$') {
                  $candidateBuild = [int]$Matches[1]
                  if ($candidateBuild -gt $maxBuild) {
                      $maxBuild = $candidateBuild
                  }
              }
          }

          $latestJson = & gh api "repos/$targetRepo/releases/latest"
          if ($LASTEXITCODE -ne 0) {
              throw 'Could not resolve latest stable private update.'
          }

          $latest = $latestJson | ConvertFrom-Json
          $latestTag = [string]$latest.tag_name

          if ($latestTag -notmatch '^desktop-v(\d+\.\d+\.\d+)-b\d+$') {
              throw "Latest stable release tag has an unsupported format: $latestTag"
          }

          $currentVersion = $Matches[1]
          $version = Get-NextMinitigerVersion $currentVersion
          $build = $maxBuild + 1

          Set-Content -Path VERSION -Value $version -NoNewline
          "MINITIGER_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "MINITIGER_PRIVATE_BUILD_NUMBER=$build" >> $env:GITHUB_ENV
          "MINITIGER_RELEASE_CHANNEL=test" >> $env:GITHUB_ENV

          Write-Host "Latest stable: $currentVersion"
          Write-Host "Next TEST candidate: $version · Build $build"

  with:
          node-version: '24'

      - name: Prepare Windows build dependencies
        shell: cmd
        run: |
          call dev\windows\setup.bat
          if errorlevel 1 exit /b 1

      - name: Prepare libVLC
        shell: cmd
        run: |
          call dev\windows\setup-vlc.bat
          if errorlevel 1 exit /b 1

      - name: Build clean private distribution
        shell: cmd
        run: |
          call dev\windows\package-clean.bat
          if errorlevel 1 exit /b 1

      - name: Create private update manifest
        shell: pwsh
        env:
          UPDATE_NOTES: ${{ inputs.notes }}
        run: |
          $ErrorActionPreference = 'Stop'

          $version = (Get-Content VERSION -Raw).Trim()
          $build = [int]$env:MINITIGER_PRIVATE_BUILD_NUMBER

          $installer = Get-ChildItem dist\Minitiger-Desktop-*-Installer.exe | Select-Object -First 1
          $portable = Get-ChildItem dist\Minitiger-Desktop-*-Portable.zip | Select-Object -First 1

          if (-not $installer -or -not $portable) {
              throw 'Private update packages were not produced.'
          }

          $installerHash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash -Algorithm SHA256 $portable.FullName).Hash.ToLowerInvariant()

          $manifest = [ordered]@{
              version = $version
              build = $build
              commit = $env:GITHUB_SHA
              publishedAt = (Get-Date).ToUniversalTime().ToString('o')
              notes = [string]$env:UPDATE_NOTES
              channel = 'test'
              installer = [ordered]@{
                  fileName = $installer.Name
                  sha256 = $installerHash
                  size = [int64]$installer.Length
              }
              portable = [ordered]@{
                  fileName = $portable.Name
                  sha256 = $portableHash
                  size = [int64]$portable.Length
              }
          }

          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 dist\minitiger-update.json

          Write-Host "Private update manifest:"
          Get-Content dist\minitiger-update.json

      - name: Publish TEST pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.MINITIGER_UPDATE_PUBLISH_TOKEN }}
          CONFIGURED_UPDATE_REPOSITORY: ${{ vars.MINITIGER_UPDATE_REPOSITORY }}
          UPDATE_NOTES: ${{ inputs.notes }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:GH_TOKEN) {
              throw 'Repository secret MINITIGER_UPDATE_PUBLISH_TOKEN is not configured.'
          }

          $targetRepo = if ($env:CONFIGURED_UPDATE_REPOSITORY) {
              $env:CONFIGURED_UPDATE_REPOSITORY
          } else {
              $env:DEFAULT_UPDATE_REPOSITORY
          }

          $version = (Get-Content VERSION -Raw).Trim()
          $build = [int]$env:MINITIGER_PRIVATE_BUILD_NUMBER
          $tag = "desktop-test-v$version-b$build"
          $title = "Minitiger Desktop $version TEST · Build $build"

          $installer = (Get-ChildItem dist\Minitiger-Desktop-*-Installer.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem dist\Minitiger-Desktop-*-Portable.zip | Select-Object -First 1).FullName
          $manifest = (Resolve-Path dist\minitiger-update.json).Path

          $notes = if ($env:UPDATE_NOTES) {
              $env:UPDATE_NOTES
          } else {
              "Private Minitiger Desktop TEST candidate build $build. Normal clients will ignore this pre-release."
          }

          Write-Host "Publishing private update to $targetRepo"
          Write-Host "Tag: $tag"

          & gh release create $tag --repo $targetRepo --title $title --notes $notes --prerelease $installer $portable $manifest

          if ($LASTEXITCODE -ne 0) {
              throw "Private GitHub release creation failed with exit code $LASTEXITCODE."
          }

      - name: Private update summary
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "### Minitiger TEST candidate published" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- Version: **$version**" >> $env:GITHUB_STEP_SUMMARY
          "- Build: **$env:MINITIGER_PRIVATE_BUILD_NUMBER**" >> $env:GITHUB_STEP_SUMMARY
          "- Candidate version: **$version TEST**" >> $env:GITHUB_STEP_SUMMARY
          "- Normal auto-update channel affected: **No**" >> $env:GITHUB_STEP_SUMMARY
          "- Release type: **Private GitHub pre-release**" >> $env:GITHUB_STEP_SUMMARY
